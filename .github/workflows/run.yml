name: outreach

on:
  schedule:
    - cron: "0 */4 * * *"   # каждые 4 часа
  workflow_dispatch: {}     # ручной запуск для проверки

concurrency:
  group: outreach          # не даём двум запускам работать одновременно
  cancel-in-progress: false

permissions:
  contents: write          # чтобы воркфлоу мог закоммитить состояние обратно

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Cycle (next city -> 50 leads -> send each with own timer)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
        # xvfb: headful-браузер без монитора (2ГИС капчит headless)
        run: xvfb-run -a python main.py --rotate-cities --limit 50 --target-leads 50 --max-firms 60 --max-pages 5

      - name: Save state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leads.json processed.txt archived.txt city_cursor.txt
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git pull --rebase -q || true
          git push
