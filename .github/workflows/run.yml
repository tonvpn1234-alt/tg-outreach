name: outreach

on:
  schedule:
    - cron: "0 */4 * * *"   # каждые 4 часа
  workflow_dispatch: {}     # ручной запуск

concurrency:
  group: outreach          # не даём двум запускам работать одновременно
  cancel-in-progress: false

permissions:
  contents: write          # коммит состояния обратно в репо
  actions: write           # самоперезапуск воркфлоу при ошибке

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Cycle (up to 3 attempts with pauses)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
        run: |
          [ -f .fails ] || echo 0 > .fails
          for i in 1 2 3; do
            echo "=== Попытка $i/3 ==="
            # xvfb: headful-браузер без монитора (2ГИС капчит headless)
            if timeout 150m xvfb-run -a python main.py --rotate-cities --limit 50 --target-leads 20 --max-firms 30 --max-pages 4; then
              echo 0 > .fails
              echo "Цикл завершился успешно"
              exit 0
            fi
            echo "Попытка $i упала (код $?). Пауза 8 минут перед следующей..."
            sleep 480
          done
          exit 1

      - name: Save state back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leads.json processed.txt archived.txt city_cursor.txt analytics.json .fails ai_cache.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git pull --rebase -q || true
          git push

      - name: Self-restart on failure (max 2 in a row)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(cat .fails 2>/dev/null || echo 0)
          COUNT=$((COUNT + 1))
          echo "Неудач подряд: $COUNT"
          echo "$COUNT" > .fails
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .fails
          git diff --cached --quiet || git commit -m "fails=$COUNT [skip ci]"
          git pull --rebase -q || true
          git push
          if [ "$COUNT" -le 2 ]; then
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/run.yml/dispatches" \
              -d '{"ref":"main"}'
            echo ">>> Воркфлоу перезапущен автоматически (неудача №$COUNT)"
          else
            echo ">>> 2 автоперезапуска подряд не помогли — жду планового расписания (нужен взгляд человека)."
          fi
